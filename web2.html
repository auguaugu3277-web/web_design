<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ICAISA 2027 — International Conference on AI & Intelligent Systems</title>
  <style>
    :root {
      --bg: #03050f;
      --surface: #080d1e;
      --gold: #c9a84c;
      --gold2: #f0d080;
      --cyan: #4dd9d9;
      --white: #f0eee8;
      --muted: #8a8fa8;
      --border: rgba(201,168,76,0.18);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--white); font-family: 'Rajdhani', sans-serif; overflow-x: hidden; }
    ::selection { background: var(--gold); color: var(--bg); }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 4px; }
  </style>
</head>
<body>
  <h1>ICAISA 2027 Template</h1>
  <p>International Conference on Artificial Intelligence & Intelligent Systems</p>
  <footer>
    <p>© 2027 ICAISA. All rights reserved.</p>
  </footer>
</body>
</html>
